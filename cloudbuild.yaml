steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=api
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/baromi-api:${_TAG}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=migrate
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/baromi-migrate:${_TAG}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=worker
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/baromi-worker:${_TAG}
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/baromi-api:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/baromi-migrate:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/baromi-worker:${_TAG}
options:
  logging: CLOUD_LOGGING_ONLY
